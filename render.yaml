# Render Blueprint for the web service. Create it in the Render dashboard with
# New > Blueprint and point it at this repository. Setup steps: docs/technical-guide.md, section 18.
services:
  - type: web
    name: benrey-support-tickets
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # Node comes from .node-version. pnpm comes from the packageManager field via Corepack.
    # NODE_ENV is not set here: the build needs devDependencies (TypeScript, types).
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Free instances have no pre-deploy command, so migrations run before the server starts.
    # A failed migration stops the deploy, and the previous version keeps serving.
    startCommand: pnpm start:prod
    healthCheckPath: /healthz
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: PAYLOAD_SECRET
        generateValue: true
      # Values below are entered in the dashboard on first sync. They are never in git.
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_PUBLIC_SERVER_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Optional: the AI field help says "not set up" without it.
      - key: GROQ_API_KEY
        sync: false
